name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export token
        run: echo "DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}" >> "$GITHUB_ENV"
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: cd /srv/orders-api && git pull && docker compose up -d --build
