# Publishes a GitHub release when a version tag is pushed (v1.2.3). The notes are
# generated from the merged pull requests since the previous tag. Operational
# tooling for THIS repo, not a template.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
