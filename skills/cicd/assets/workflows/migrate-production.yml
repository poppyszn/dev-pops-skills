name: Migrate production database

# Manual only. Runs the api image's migrations against the production database
# on their own, without deploying anything. Deploys already run migrations
# before restarting the api; use this to run them separately.
#
# Assumes docker/production/.env and the repository checkout already exist on
# the host from a prior deploy-production run. Uses the image for IMAGE_TAG
# (default latest-production; pass a commit SHA to migrate with an exact image).
# Migrations are not reversed by a redeploy: check them before running.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to migrate with (a commit SHA, or latest-production)"
        required: false
        type: string
        default: latest-production

# Shared with deploy-production so a migration can never overlap a deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Run production migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # docker login + pull from GHCR on the remote host
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_ACTOR: ${{ github.actor }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      WORKING_DIR: ${{ secrets.WORKING_DIR }}
      REPO: ${{ github.repository }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      # || '22': an unset secret is an empty string, and `ssh -p ''` fails with "Bad port ''".
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      SSH_JUMP_HOST: ${{ secrets.SSH_JUMP_HOST }}
      SSH_USER_JUMP: ${{ secrets.SSH_USER_JUMP }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_KNOWN_HOSTS is empty. Add the output of: ssh-keyscan -p <port> <host>" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          {
            echo "Host ${SSH_HOST}"
            echo "  StrictHostKeyChecking yes"
            if [ -n "$SSH_JUMP_HOST" ]; then
              echo "  ProxyJump ${SSH_USER_JUMP}@${SSH_JUMP_HOST}"
            fi
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Run migrations
        run: |
          ssh -p "$SSH_PORT" "$SSH_TARGET" \
            GH_TOKEN="$(printf '%q' "$GH_TOKEN")" \
            GH_ACTOR="$(printf '%q' "$GH_ACTOR")" \
            IMAGE_TAG="$(printf '%q' "$IMAGE_TAG")" \
            WORKING_DIR="$(printf '%q' "$WORKING_DIR")" \
            REPO="$(printf '%q' "$REPO")" \
            'bash -s' << 'EOF'
          set -euo pipefail
          # Log out however this script ends, so the credentials do not stay on the host.
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          cd "${WORKING_DIR}/${REPO##*/}/docker/production"
          # Refuse to run against anything that is not declared production.
          if ! grep -qE '^NODE_ENV=production[[:space:]]*$' .env; then
            echo "Refusing to migrate: docker/production/.env must declare NODE_ENV=production." >&2
            exit 1
          fi
          export IMAGE_TAG
          docker compose --env-file .env pull migrate
          # < /dev/null is required: `docker compose run` reads stdin, and this
          # script is itself the stdin. Without it the container eats the lines
          # below and the step still passes.
          docker compose --env-file .env run --rm migrate < /dev/null
          echo "Migrations finished."
          EOF

      - name: Migration summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Production migration report"
            echo "- **Status**: ${JOB_STATUS}"
            echo "- **Image tag**: \`${IMAGE_TAG}\`"
            echo "- **Triggered by**: ${ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
