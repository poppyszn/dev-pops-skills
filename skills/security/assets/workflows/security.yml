name: Security

on:
  # Same policy as CI: pull requests (not pushes), plus the weekly schedule
  # for new CVEs against unchanged code, plus manual re-runs.
  pull_request:
    branches: [<INTEGRATION_BRANCH>]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: # manual re-run, e.g. right after a new CVE disclosure

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs gitleaks' own OSS image directly rather than the
      # gitleaks-action wrapper, which needs a license key (free, but
      # registration required) for repos owned by an organization. The
      # image needs no key for any account type.
      # Pinned to an exact release, never :latest. Check for a newer one at
      # https://github.com/gitleaks/gitleaks/releases when updating.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --redact -v --exit-code 1

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: security-scan:latest

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: security-scan:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
