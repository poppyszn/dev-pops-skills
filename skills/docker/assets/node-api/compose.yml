services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  migrate:
    build:
      context: ../..
      dockerfile: docker/node-api/Dockerfile
    command: migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ../..
      dockerfile: docker/node-api/Dockerfile
    command: seed
    env_file: .env
    profiles: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: docker/node-api/Dockerfile
    command: start
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # 127.0.0.1, not localhost: the image resolves localhost to ::1 first
    # and Node binds IPv4, so the check fails against a healthy server and
    # every `depends_on: condition: service_healthy` downstream stalls.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  postgres-data:
